name: Release

on:
  workflow_run:
    workflows: [ "Build" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Re-release the catalog version even if that tag already exists'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signing-check:
    name: Check Android signing configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check signing secrets
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Release signing is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release skipped: configure KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS in repository Actions secrets. KEY_PASSWORD is optional when it matches KEYSTORE_PASSWORD."
          fi

  release:
    name: Build and publish signed APK
    needs: signing-check
    if: ${{ needs.signing-check.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail
          CATALOG=gradle/libs.versions.toml
          released() { gh release view "v$1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; }
          VERSION=$(sed -n 's/^app-version-name = "\(.*\)"/\1/p' "$CATALOG")
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid app version: '${VERSION}'"; exit 1 ;;
          esac
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [ "${FORCE_RELEASE:-}" != "true" ]; then
            FOUND=false
            for _ in $(seq 1 200); do
              if released "$VERSION"; then
                PATCH=$((PATCH + 1))
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
              else
                FOUND=true
                break
              fi
            done
            [ "$FOUND" = "true" ] || { echo "No free version found"; exit 1; }
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          sed -i -E "s/^app-version-name = \".*\"/app-version-name = \"${VERSION}\"/" "$CATALOG"
          sed -i -E "s/^app-version-code = \".*\"/app-version-code = \"${VERSION_CODE}\"/" "$CATALOG"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name artifact
        id: name
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DiscordRP-${VERSION}.apk"
          echo "apk=DiscordRP-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          CATALOG=gradle/libs.versions.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add "$CATALOG"
            if git diff --cached --quiet; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: release v${VERSION} [skip ci]"
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            sed -i -E "s/^app-version-name = \".*\"/app-version-name = \"${VERSION}\"/" "$CATALOG"
            sed -i -E "s/^app-version-code = \".*\"/app-version-code = \"${VERSION_CODE}\"/" "$CATALOG"
          done
          echo "Could not push version bump"
          exit 1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          files: ${{ steps.name.outputs.apk }}
          generate_release_notes: true

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"